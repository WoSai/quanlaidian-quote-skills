name: Skill prompt-validation tests

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "references/**"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/skill-prompt-tests.yml"
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "references/**"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/skill-prompt-tests.yml"
  workflow_dispatch:

jobs:
  prompt-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run prompt-validation tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL_TEST_MODEL: ${{ vars.SKILL_TEST_MODEL || 'claude-opus-4-7' }}
          SKILL_TEST_EFFORT: ${{ vars.SKILL_TEST_EFFORT || 'low' }}
        run: pytest tests/ -v --tb=short
